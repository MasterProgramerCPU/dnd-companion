name: Build Windows app

# PyInstaller cannot cross-compile, so the executable has to be produced on a
# Windows runner. Push a tag to cut a release; run it by hand to test a build.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build the executable
        run: uv run --with pyinstaller pyinstaller --noconfirm packaging/dnd-companion.spec

      - name: Smoke-test the build
        shell: pwsh
        # --no-window runs the bundle without opening a window, so the test
        # doesn't depend on the runner having a desktop. If the build is missing
        # web/ or a uvicorn backend it fails here, not on someone's table.
        run: |
          $env:DND_PORT = "8799"
          $env:DND_DATA_DIR = "$env:RUNNER_TEMP\dnd-smoke"
          $p = Start-Process -PassThru "dist\DnD Table Companion.exe" -ArgumentList "--no-window"
          Start-Sleep -Seconds 20
          try {
            foreach ($path in @("/", "/dm", "/qr.svg", "/static/js/common.js")) {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799$path"
              if ($r.StatusCode -ne 200) { throw "$path returned $($r.StatusCode)" }
              Write-Host "$path OK"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DnD-Table-Companion-windows
          path: dist/DnD Table Companion.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DnD Table Companion.exe
