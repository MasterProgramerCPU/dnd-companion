<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<title>DM console</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<style>
  main { max-width: 1000px; }

  /* The DM is at a laptop, not holding a phone, and the Campaign tab is a wall
     of cards that have nothing to do with each other: handouts, the item
     library, loot, quests, NPCs, the treasury, notes. Stacked in one column
     that meant scrolling past six to reach the seventh, mid-session, which is
     the worst possible time. Two columns on a laptop, three on a desktop; the
     cards are untouched and simply pack better.

     Combat stays one column on purpose. Initiative is an ordered list, and an
     order that runs down one column and back up the next is not an order. */
  @media (min-width: 1100px) {
    main { max-width: 1340px; }
    .tab-panel[data-tab=campaign].active { column-count: 2; column-gap: 13px; }
    .tab-panel[data-tab=campaign] .card { break-inside: avoid; }
  }
  @media (min-width: 1640px) {
    .tab-panel[data-tab=campaign].active { column-count: 3; }
  }

  /* The other end of the same problem. The player's tabs are short words that
     fit a phone at any size; the DM's are BESTIARY and CAMPAIGN, which do not,
     and a label clipped mid-word reads as broken rather than abbreviated. The
     console is a laptop screen in practice, so below tablet width keep the
     icons — which are what you aim at anyway — and let the aria-label on each
     button carry the name for anyone listening rather than looking. */
  @media (max-width: 560px) {
    nav.tabbar button .lbl { display: none; }
    nav.tabbar button .ico { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <i class="dot"></i>
  <div class="grow" style="min-width:0">
    <div class="title">…</div>
    <div class="who muted">DM console</div>
  </div>
  <button class="btn sm" id="campaigns" title="Campaigns">📚</button>
</header>

<main>
  <section class="tab-panel" data-tab="combat"></section>
  <section class="tab-panel" data-tab="party"></section>
  <section class="tab-panel" data-tab="journey"></section>
  <section class="tab-panel" data-tab="bestiary"></section>
  <section class="tab-panel" data-tab="campaign"></section>
  <section class="tab-panel" data-tab="dice"></section>
  <section class="tab-panel" data-tab="log"><div class="card"><h3>Roll log</h3><div id="log"></div></div></section>
</main>

<nav class="tabbar">
  <button data-tab="combat"><span class="ico">⚔️</span>Combat</button>
  <button data-tab="party"><span class="ico">👥</span>Party</button>
  <button data-tab="journey"><span class="ico">🗺️</span>Map</button>
  <button data-tab="bestiary"><span class="ico">🐉</span>Bestiary</button>
  <button data-tab="campaign"><span class="ico">📖</span>Campaign</button>
  <button data-tab="dice"><span class="ico">🎲</span>Dice</button>
  <button data-tab="log"><span class="ico">📜</span>Log</button>
</nav>

<script src="/static/js/dice3d.js"></script>
<script src="/static/js/dicebox.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/sheet.js"></script>
<script src="/static/js/bestiary.js"></script>
<script src="/static/js/items.js"></script>
<script src="/static/js/dm.js"></script>
</body>
</html>
